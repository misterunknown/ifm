name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history + tags so git describe works as a fallback

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, bz2, posix, fileinfo, curl, mbstring, phar
          coverage: none
          tools: composer

      - name: Install dependencies
        # build needs matthiasmullie/minify, which lives in require-dev
        run: composer install --no-interaction --no-progress

      - name: Build artifacts
        env:
          # tag name (e.g. v4.2.0) is the authoritative version for a release
          IFM_VERSION: ${{ github.ref_name }}
        run: |
          php compiler.php
          php compiler.php --cdn

      - name: Verify embedded version matches the tag
        run: |
          grep -q "releases/tag/${GITHUB_REF_NAME}" dist/ifm.php \
            || { echo "::error::embedded version does not match ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/ifm.php \
            dist/ifm.min.php \
            dist/cdn.ifm.php \
            dist/cdn.ifm.min.php \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
