name: Docker

on:
  push:
    branches: [ "master", "v4.0" ]
  pull_request:
    branches: [ "master", "v4.0" ]

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [ 'regular', 'cdn' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags for git describe

      - name: Determine version
        run: echo "IFM_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg CDN=${{ matrix.variant == 'cdn' }} --build-arg IFM_VERSION="$IFM_VERSION" -t ifm:ci .

      - name: Smoke test
        run: tests/docker/smoke-test.sh ifm:ci ${{ matrix.variant }} "$IFM_VERSION"
